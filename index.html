<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper — Image Border Tool</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#111;display:flex;justify-content:center;padding:32px 16px}.app{width:min(900px,100%)}header{text-align:center;margin-bottom:24px}h1{margin:0 0 8px;font-size:36px}p{margin:0;color:#666}.panel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0000000d}.drop{border:2px dashed #bbb;border-radius:14px;padding:34px;text-align:center;cursor:pointer;transition:.2s}.drop:hover,.drop.drag{border-color:#111;background:#fafafa}.drop strong{display:block;font-size:18px;margin-bottom:6px}.drop span{color:#777;font-size:14px}.controls{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-top:20px}.control label{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600}.control input{width:100%}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#111;color:#fff}button.secondary{background:#e9e9e9;color:#111}button:disabled{opacity:.4;cursor:not-allowed}.preview{margin-top:24px;min-height:220px;border-radius:14px;background:repeating-conic-gradient(#eee 0 25%,#f8f8f8 0 50%) 50%/20px 20px;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px}.preview img{max-width:100%;max-height:60vh;display:block;object-fit:contain}.info{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:#666;font-size:13px;flex-wrap:wrap}@media(max-width:600px){.controls{grid-template-columns:1fr}.panel{padding:16px}h1{font-size:30px}}
</style>
</head>
<body>
<main class="app">
<header><h1>Clipper</h1><p>Add or remove a white border from your image.</p></header>
<section class="panel">
<div class="drop" id="drop"><strong>Drop an image here</strong><span>or click to choose a JPG, PNG, or WebP</span><input id="file" type="file" accept="image/*" hidden></div>
<div class="controls">
<div class="control"><label for="amount"><span>Border / crop</span><span id="amountValue">20%</span></label><input id="amount" type="range" min="1" max="50" value="20"></div>
<div class="info"><span id="dimensions">No image selected</span></div>
</div>
<div class="buttons"><button id="add" disabled>Add white border</button><button id="remove" class="secondary" disabled>Remove border</button><button id="download" class="secondary" disabled>Download PNG</button></div>
<div class="preview" id="preview"><span id="placeholder">Your image preview will appear here.</span><img id="image" hidden alt="Preview"></div>
<div class="info"><span>Add expands all four sides by the selected percentage of the original dimensions.</span><span>Remove crops that same percentage from each side.</span></div>
</section>
</main>
<script>
const fileInput=document.getElementById('file');
const drop=document.getElementById('drop');
const amount=document.getElementById('amount');
const amountValue=document.getElementById('amountValue');
const add=document.getElementById('add');
const remove=document.getElementById('remove');
const download=document.getElementById('download');
const image=document.getElementById('image');
const placeholder=document.getElementById('placeholder');
const dimensions=document.getElementById('dimensions');
let source=null;
let sourceName='image';
let lastBlob=null;

amount.addEventListener('input',()=>amountValue.textContent=amount.value+'%');
drop.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>loadFile(e.target.files[0]));
['dragenter','dragover'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(type=>drop.addEventListener(type,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
add.addEventListener('click',()=>process('add'));
remove.addEventListener('click',()=>process('remove'));
download.addEventListener('click',()=>{if(!lastBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download=sourceName.replace(/\.[^.]+$/,'')+'-clipped.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});

function loadFile(file){
 if(!file||!file.type.startsWith('image/'))return;
 sourceName=file.name||'image';
 const reader=new FileReader();
 reader.onload=()=>{const img=new Image();img.onload=()=>{source=img;lastBlob=null;image.src=reader.result;image.hidden=false;placeholder.hidden=true;add.disabled=false;remove.disabled=false;download.disabled=true;dimensions.textContent=`${img.naturalWidth} × ${img.naturalHeight}px`};img.src=reader.result};reader.readAsDataURL(file);
}

function process(mode){
 if(!source)return;
 const p=Number(amount.value)/100;
 const w=source.naturalWidth,h=source.naturalHeight;
 const canvas=document.createElement('canvas');
 const ctx=canvas.getContext('2d');
 if(mode==='add'){
  const x=Math.round(w*p),y=Math.round(h*p);
  canvas.width=w+x*2;canvas.height=h+y*2;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(source,x,y,w,h);
 }else{
  const x=Math.round(w*p),y=Math.round(h*p);
  const cropW=Math.max(1,w-x*2),cropH=Math.max(1,h-y*2);
  canvas.width=cropW;canvas.height=cropH;ctx.drawImage(source,x,y,cropW,cropH,0,0,cropW,cropH);
 }
 canvas.toBlob(blob=>{lastBlob=blob;image.src=URL.createObjectURL(blob);dimensions.textContent=`${canvas.width} × ${canvas.height}px`;download.disabled=false},'image/png');
}
</script>
</body>
</html>
